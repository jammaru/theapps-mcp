name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # Required for npm Trusted Publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm >= 11.5.1
      - name: Ensure recent npm
        run: npm install -g npm@latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke CLI (Node)
        run: node bin/theapps-mcp.js help

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "Publishing theapps-mcp@$VERSION"

      # Auth via OIDC Trusted Publishing — no NPM_TOKEN
      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "theapps-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "theapps-mcp@$VERSION already on npm — skip publish"
          else
            npm publish --access public --provenance
          fi

      - name: Pack Agent Skill zip
        run: node ./scripts/pack-skill.mjs

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release v$VERSION already exists — upload skill zip if missing"
            if ! gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx 'apps-api-skill.zip'; then
              gh release upload "v$VERSION" apps-api-skill.zip --clobber
            fi
          else
            NOTES="$(cat <<EOF
          ## Agent Skills
          - Claude Desktop: upload the attached \`apps-api-skill.zip\`
          - Coding agents: \`npx skills add jammaru/theapps-mcp\`
          EOF
          )"
            # strip common indent from heredoc
            NOTES="$(printf '%s\n' "$NOTES" | sed -e 's/^          //')"
            gh release create "v$VERSION" \
              apps-api-skill.zip \
              --title "v$VERSION" \
              --notes "$NOTES" \
              --generate-notes \
              --verify-tag
          fi
