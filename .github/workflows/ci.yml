name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke CLI (Node)
        run: node bin/theapps-mcp.js help

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check flake.lock
        uses: DeterminateSystems/flake-checker-action@v14

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Evaluate flake
        run: nix flake check --print-build-logs

      - name: Check Nix formatting
        run: nix develop --command treefmt --ci

      - name: Smoke toolchain
        run: nix develop --command bash -lc 'bun --version && node --version'

